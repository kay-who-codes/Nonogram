<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nonogram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #15171c;
    --bg-raised: #1b1e25;
    --line: #262a33;
    --line-strong: #383d4a;
    --ink: #e8e6df;
    --clue: #8b92a3;
    --clue-dim: #4d5260;
    --accent: #7fb88f;
    --accent-dim: #4a6e54;
    --mark: #c97b6e;
    --error: #c9716e;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
  }

  body {
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 28px 28px;
    background-attachment: fixed;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .sheet {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }

  header {
    width: 100%;
    text-align: left;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--clue-dim);
    margin: 0 0 4px 0;
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }

  h1 span {
    color: var(--accent);
  }

  .board-wrap {
    background: var(--bg-raised);
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    padding: 22px;
    box-shadow: 0 18px 40px -20px rgba(0,0,0,0.6);
  }

  .grid-frame {
    display: grid;
    grid-template-columns: auto 1fr;
    grid-template-rows: auto 1fr;
  }

  .corner {
    border-bottom: 2px solid var(--line-strong);
    border-right: 2px solid var(--line-strong);
  }

  .col-clues {
    display: grid;
    grid-template-columns: repeat(5, var(--cell, 52px));
    border-bottom: 2px solid var(--line-strong);
  }

  .col-clue {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--clue);
    padding: 4px 0 6px 0;
    line-height: 1.35;
    user-select: none;
  }

  .row-clues {
    display: grid;
    grid-template-rows: repeat(5, var(--cell, 52px));
    border-right: 2px solid var(--line-strong);
  }

  .row-clue {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--clue);
    padding: 0 10px 0 4px;
    user-select: none;
  }

  .cells {
    display: grid;
    grid-template-columns: repeat(5, var(--cell, 52px));
    grid-template-rows: repeat(5, var(--cell, 52px));
  }

  .cell {
    width: var(--cell, 52px);
    height: var(--cell, 52px);
    border: 1px solid var(--line);
    background: var(--bg);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: background 0.12s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .cell:nth-child(5n+1) { border-left: 2px solid var(--line-strong); }
  .cell:nth-child(-n+5) { border-top: 2px solid var(--line-strong); }
  .cell:nth-child(5n) { border-right: 2px solid var(--line-strong); }
  .cells .cell:nth-last-child(-n+5) { border-bottom: 2px solid var(--line-strong); }

  .cell:hover { background: #20232b; }

  .cell.filled {
    background: var(--ink);
    border-color: var(--ink);
  }
  .cell.filled:hover { background: var(--ink); }

  .cell.marked::before,
  .cell.marked::after {
    content: '';
    position: absolute;
    width: 56%;
    height: 2px;
    background: var(--clue-dim);
    border-radius: 1px;
  }
  .cell.marked::before { transform: rotate(45deg); }
  .cell.marked::after { transform: rotate(-45deg); }

  .solved .cell.filled {
    background: var(--accent);
    border-color: var(--accent);
  }

  .status-row {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--clue);
    min-height: 18px;
  }

  .status-row .win {
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 0.03em;
  }

  .controls {
    width: 100%;
    display: flex;
    gap: 10px;
  }

  button {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    border-radius: 5px;
    border: 1px solid var(--line-strong);
    background: var(--bg-raised);
    color: var(--ink);
    padding: 11px 16px;
    cursor: pointer;
    flex: 1;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  button:hover {
    border-color: var(--accent-dim);
    background: #1f2329;
  }

  button.primary {
    background: var(--accent-dim);
    border-color: var(--accent-dim);
    color: #eafff0;
  }
  button.primary:hover {
    background: #557a60;
  }

  .hint {
    font-size: 12px;
    color: var(--clue-dim);
    text-align: center;
    line-height: 1.5;
  }

  @media (max-width: 420px) {
    :root { --cell: 44px; }
    .col-clue, .row-clue { font-size: 11px; }
  }
</style>
</head>
<body>

<div class="sheet">
  <header>
    <p class="eyebrow">Logic Grid · 5×5</p>
    <h1>Non<span>o</span>gram</h1>
  </header>

  <div class="board-wrap">
    <div class="grid-frame" id="frame">
      <div class="corner"></div>
      <div class="col-clues" id="colClues"></div>
      <div class="row-clues" id="rowClues"></div>
      <div class="cells" id="cells"></div>
    </div>
  </div>

  <div class="status-row">
    <span id="statusText">Left-click to fill · right-click to mark</span>
    <span id="winText" class="win"></span>
  </div>

  <div class="controls">
    <button id="newBtn" class="primary">New puzzle</button>
    <button id="clearBtn">Clear</button>
  </div>

  <p class="hint">Numbers show runs of filled squares, in order, for that row or column.</p>
</div>

<script>
(function () {
  const SIZE = 5;
  let solution = [];      // SIZE x SIZE booleans, the answer
  let playerState = [];   // SIZE x SIZE: 0 empty, 1 filled, 2 marked-X
  let solved = false;

  const cellsEl = document.getElementById('cells');
  const colCluesEl = document.getElementById('colClues');
  const rowCluesEl = document.getElementById('rowClues');
  const frameEl = document.getElementById('frame');
  const winText = document.getElementById('winText');
  const statusText = document.getElementById('statusText');

  function emptyGrid(fill) {
    return Array.from({ length: SIZE }, () => Array(SIZE).fill(fill));
  }

  // Compute run-length clues for a single line (row or column array of booleans)
  function lineClues(line) {
    const runs = [];
    let count = 0;
    for (const v of line) {
      if (v) {
        count++;
      } else if (count > 0) {
        runs.push(count);
        count = 0;
      }
    }
    if (count > 0) runs.push(count);
    return runs.length ? runs : [0];
  }

  function getRow(grid, r) { return grid[r]; }
  function getCol(grid, c) { return grid.map(row => row[c]); }

  // Generate a random solvable, non-trivial 5x5 puzzle.
  function generatePuzzle() {
    let attempt = 0;
    while (true) {
      attempt++;
      const grid = emptyGrid(false);
      const fillProbability = 0.45 + Math.random() * 0.15; // 45-60% filled
      let filledCount = 0;
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const v = Math.random() < fillProbability;
          grid[r][c] = v;
          if (v) filledCount++;
        }
      }

      // Reject degenerate puzzles: all empty, all full, or too sparse/dense
      if (filledCount < 6 || filledCount > 19) continue;

      // Reject if any row or column is fully empty (boring, gives away too much)
      let hasEmptyLine = false;
      for (let r = 0; r < SIZE; r++) {
        if (getRow(grid, r).every(v => !v)) hasEmptyLine = true;
      }
      for (let c = 0; c < SIZE; c++) {
        if (getCol(grid, c).every(v => !v)) hasEmptyLine = true;
      }
      if (hasEmptyLine && attempt < 200) continue;

      // Reject if puzzle has very low information content (e.g. checkerboard-trivial or symmetric duplicate of all lines)
      const rowClueSets = new Set();
      for (let r = 0; r < SIZE; r++) rowClueSets.add(lineClues(getRow(grid, r)).join(','));
      if (rowClueSets.size === 1 && attempt < 200) continue; // every row identical = boring

      return grid;
    }
  }

  function buildClueArrays(grid) {
    const rows = [];
    const cols = [];
    for (let r = 0; r < SIZE; r++) rows.push(lineClues(getRow(grid, r)));
    for (let c = 0; c < SIZE; c++) cols.push(lineClues(getCol(grid, c)));
    return { rows, cols };
  }

  function render() {
    const { rows, cols } = buildClueArrays(solution);

    // column clues
    colCluesEl.innerHTML = '';
    cols.forEach(clue => {
      const div = document.createElement('div');
      div.className = 'col-clue';
      div.innerHTML = clue.map(n => `<span>${n}</span>`).join('');
      colCluesEl.appendChild(div);
    });

    // row clues
    rowCluesEl.innerHTML = '';
    rows.forEach(clue => {
      const div = document.createElement('div');
      div.className = 'row-clue';
      div.textContent = clue.join(' ');
      rowCluesEl.appendChild(div);
    });

    // cells
    cellsEl.innerHTML = '';
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const div = document.createElement('div');
        div.className = 'cell';
        div.dataset.r = r;
        div.dataset.c = c;
        applyCellClass(div, playerState[r][c]);

        div.addEventListener('click', () => {
          if (solved) return;
          const cur = playerState[r][c];
          playerState[r][c] = cur === 1 ? 0 : 1;
          applyCellClass(div, playerState[r][c]);
          checkWin();
        });

        div.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          if (solved) return;
          const cur = playerState[r][c];
          playerState[r][c] = cur === 2 ? 0 : 2;
          applyCellClass(div, playerState[r][c]);
        });

        cellsEl.appendChild(div);
      }
    }

    frameEl.classList.remove('solved');
    winText.textContent = '';
    statusText.textContent = 'Left-click to fill · right-click to mark';
  }

  function applyCellClass(div, state) {
    div.classList.remove('filled', 'marked');
    if (state === 1) div.classList.add('filled');
    if (state === 2) div.classList.add('marked');
  }

  function checkWin() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const isFilled = playerState[r][c] === 1;
        if (isFilled !== solution[r][c]) return;
      }
    }
    solved = true;
    frameEl.classList.add('solved');
    winText.textContent = 'SOLVED';
    statusText.textContent = 'Nicely done.';
  }

  function newPuzzle() {
    solution = generatePuzzle();
    playerState = emptyGrid(0);
    solved = false;
    render();
  }

  function clearBoard() {
    if (solved) return;
    playerState = emptyGrid(0);
    document.querySelectorAll('.cell').forEach(div => applyCellClass(div, 0));
  }

  document.getElementById('newBtn').addEventListener('click', newPuzzle);
  document.getElementById('clearBtn').addEventListener('click', clearBoard);

  newPuzzle();
})();
</script>

</body>
</html>
